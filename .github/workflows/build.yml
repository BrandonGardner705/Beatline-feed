name: Build feed

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 minutes
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: beatline-feed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beatline-feed/package-lock.json
      - run: npm ci
      - name: Restore last run (team feeds, schedules, AI summaries)
        uses: actions/cache@v4
        with:
          path: |
            beatline-feed/cache
            beatline-feed/public
          key: feed-cache-${{ github.run_id }}
          restore-keys: feed-cache-
      - name: Build feed
        run: npm run build
        timeout-minutes: 18
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TEAM_CONCURRENCY: 8
      - name: Add the Diehard web app (served at /app/)
        run: mkdir -p public/app && cp web/index.html public/app/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: beatline-feed/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
